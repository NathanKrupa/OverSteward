[project]
name = "oversteward"
version = "0.1.0"
description = "House of Krupa governance — orchestration of cross-repo contracts, shared souls, and managed CLAUDE.md blocks."
requires-python = ">=3.12"
authors = [{name = "Nathan Krupa"}]
license = {text = "Proprietary"}
readme = "OVERSTEWARD.md"

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "gaudi-linter>=0.2.0",
    "pre-commit>=3.0",
    "pytest>=8.0",
]
# Live read for the Vintner /pipeline-status skill. Kept optional so the
# pure-logic spine and its tests need no DB driver (and CI has no DB).
vintner = [
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oversteward"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
