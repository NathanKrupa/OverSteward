[project]
name = "oversteward"
version = "0.1.0"
description = "House of Krupa governance — orchestration of cross-repo contracts, shared souls, and managed CLAUDE.md blocks."
requires-python = ">=3.12"
authors = [{name = "Nathan Krupa"}]
license = {text = "Proprietary"}
readme = "OVERSTEWARD.md"

dependencies = [
    # The page-judge quality-rater pass (OS#417). Declared here, not optional:
    # scripts/page_judge.py is a first-class entry point of this repo.
    "google-genai>=2.20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "gaudi-linter>=0.3.0",
    "pre-commit>=3.0",
    "pytest>=8.0",
]
# Live read for the Vintner /pipeline-status skill. Kept optional so the
# pure-logic spine and its tests need no DB driver (and CI has no DB).
vintner = [
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oversteward"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Integration tests spend real money against a live API, so an ordinary suite
# run must never reach them. Deselection prints as "deselected", never as a
# pass — run them deliberately with `-m integration`.
addopts = ["-m", "not integration"]
markers = [
    "integration: hits a live external API; key-gated and excluded from the default run",
]

[tool.ruff]
target-version = "py312"
line-length = 100
