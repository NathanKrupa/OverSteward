[project]
name = "oversteward"
version = "0.1.0"
description = "House of Krupa governance — orchestration of cross-repo contracts, shared souls, and managed CLAUDE.md blocks."
requires-python = ">=3.12"
authors = [{name = "Nathan Krupa"}]
license = {text = "Proprietary"}
readme = "OVERSTEWARD.md"

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "gaudi-linter>=0.2.0",
    "pre-commit>=3.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Phase 1 has no installable package — scripts/ runs in-place. Hatch
# requires at least one packages entry; point at scripts/ so wheel
# builds (if ever needed) don't fail. Revisit when Phase 2 promotes
# scripts/ into a proper src/oversteward/ layout.
packages = ["scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100
