  flows: Liveness for contexts with a `railway:` block (AG, GS only); Sentry issues org-wide
  cite: '`src/oversteward/liveness/config.py:34`, `registry.yaml:166,298`; `src/oversteward/sentry/`'
- id: S-14
  label: billing APIs, GA4 → exchequer
  producer:
