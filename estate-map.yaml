seams:
- id: S-1
  label: grantspider → aigranthelper (data)
  producer: [grantspider]
  consumer: [aigranthelper]
  flows: AG reads the research DB through **`ag_research.*` views and functions** (26 unmanaged `_v` models,
    plus search/match SQL functions), connecting with the read-only `ag_research_reader` role. Nine documented
    base-table reads remain, each tagged `READS-BASE-TABLE:`. `grantspider.ontology` supplies one type
    (`NteeCode`) and is not the read path
  cite: GS `src/grantspider/ag_research_views/__init__.py`; AG `apps/research/models/_views.py`, `apps/core/grantspider_reads.py`,
    `docs/CROSS_REPO_SCHEMA.md` rule 1; OverSteward `documentation/data-contract-grantspider-aigranthelper.md`
    v1.2
  invariants: [I-4, I-6]
- id: S-2
  label: grantspider → aigranthelper (code)
  producer: [grantspider]
  consumer: [aigranthelper]
  flows: 'AG pins GS by SHA (`requirements.txt:463`, matched by `research_schema.lock`) and imports `grantspider.models`,
    `connectors.b2_storage` and `services.db_backup` at runtime. A push to GS main fires `repository_dispatch:
    gs-master-bump`; AG''s bump workflow rejects non-`refs/heads/main` refs and force-updates one draft
    PR onto AG `staging`'
  cite: GS `.github/workflows/notify-ag-on-main.yml:25-49`; AG `.github/workflows/bump-gs-pin.yml:28,79,203,212`,
    `apps/research/apps.py:26`, `apps/ops/management/commands/backup_database.py:52,93`
  invariants: [I-18, I-19, I-20]
- id: S-3
  label: grantspider → aigranthelper (schema drift)
  producer: [grantspider]
  consumer: [aigranthelper]
  flows: AG CI diffs `_generated.py` against GS `schema/research.sql` at the locked SHA. `_views.py` is
    not checked (G1)
  cite: AG `scripts/tools/check_research_drift.py`, `.github/workflows/ci.yml:744`
