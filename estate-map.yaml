  stack: Python 3.14, Django 6.0, HTMX + Tailwind v4 (no SPA); Railway (Railpack from `Procfile`, web
    + cron services + internal Typesense); tenant DB = Railway Postgres 17 (`config/settings/base.py:217`),
    research DB = GS's Neon via `RESEARCH_DATABASE_URL` (`base.py:246-266`)
  surfaces: 'Scheduled work runs as Railway cron services (`render_sitemaps`, `submit_seo_urls`, `monitor_indexation`,
    `backup_database`, digests/reminders, email outbox), listed in `docs/operations/production-deploy.md:168-242`.
    GitHub Actions crons are `smoke.yml`, `divergence-watchdog.yml` and `prewarm.yml` (a daily Neon warm-up
    request, #1341).'
- id: grantspider
  purpose: Grant/foundation data producer — ingestion, crawl, enrichment; sole owner and writer of the
    research schema
  stack: 'Python 3.14, SQLAlchemy + Alembic, pgvector, Neon; Dagster on Railway (`railway.toml`: dagster-webserver,
    dagster-daemon, dagster-code, daemon-watchdog cron; assets in `src/grantspider/orchestration/definitions.py`)'
- id: wphelper
  purpose: WordPress client toolkit; canonical home for external connectors (WP REST, Kit, GA4, GSC, FTP,
