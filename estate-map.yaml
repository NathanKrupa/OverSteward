# ABOUTME: The estate capability map — what the estate builds, where each capability lives, its current and target shape.
# ABOUTME: Also the single record of repos, cross-repo seams, load-bearing invariants and known liabilities.
#
# Maintenance protocol
# - Read at scope/plan time: the digest (data/estate-map-digest.md, loaded by CLAUDE.md) for orientation,
#   then grep `invariants:` and `liabilities:` here for the surface you are touching. Routine single-issue
#   pickup does not require this file.
# - Verify the propagation surface exists before scoping cross-repo or "propagate through Y" work: git grep
#   for the managed-block markers or the seam named under `seams:`, and confirm the consumer reads it. If the
#   surface is absent, building it is part of the work, not a follow-up (OS#129).
# - Edit in the same PR as any direction decision, and in any session that learns a row is wrong, lands a
#   seam- or invariant-surface PR, or discovers a new invariant or liability.
# - Cite or omit: every seam, invariant and liability carries a source a reader can open.
# - Verify against code, not against this file: read producer and consumer on origin
#   (`git show origin/<branch>:<path>`); primary checkouts run stale.
# - After an edit: `scripts/estate_map.py render --write`, then `scripts/estate_map.py check`
#   (the seventh session-start sweep; 0 clean, 1 findings, 2 could not look).
# - History: `git log -p -- estate-map.yaml`.
#
# Seams, invariants and liabilities migrated verbatim from the 2026-10-31 verification (OS#638), read at
# AG origin/main f2a8d99, GS origin/main be9ed67, OverSteward origin/master 775accd.
#
# Schema
# - capabilities[].id: `<product>.<kebab>`, unique and stable; the product is a `mission.products` id.
# - kind: code | process | content. status: planned | building | live | retired.
# - claims: {<repo>: [repo-relative paths]}; a path ending in `/` (or naming no file) claims its subtree.
#   Under a `policy.explicit_only` root every claim names one file.
# - locations: [{type, ref, unverified}]. path | report | workflow | timer refs are `<repo>:<path>` and are
#   read from git unless `unverified: true`; vault | todoist | dashboard must be `unverified: true`.
# - serves / depends_on / feeds name capability ids. invariants / liabilities name rows below, and each
#   row's `capabilities` lists exactly the capabilities citing it.
# - current_shape is measured, not flattering. target_shape is prose, or `hold` where no edit is planned.
# - seams[].producer / consumer are repo ids, or `ext:<name>` for a party outside the estate.
# - policy.coverage_floor: null is unmeasured (printed, never compared); a number is compared both ways.

version: 1

mission:
  north_star: 'Provide A+ grant-writing tools to the servants of the poor: the food pantries, parishes
    and small charities who work on shoestring budgets and are not grant experts. It is not about the
    money; it is about the people.'
  products:
  - id: ag
    serves: grant seekers at small nonprofits, the users of aigranthelper.com
    repo: aigranthelper
  - id: gs
    serves: AI Grant Helper, as the producer of its funder and grant research
    repo: grantspider
  - id: wp
    serves: Nathan's WordPress clients, and the estate as its external-connector library
    repo: wphelper
  - id: aa
    serves: The Almoner's content authoring, CRM and WordPress work
    repo: ai-assistants
  - id: os
    serves: Nathan and every estate session, as the control plane
    repo: oversteward
  - id: gaudi
    serves: every gated estate repo as its architecture linter, and the public as open source
    repo: gaudi
  - id: fiscus
    serves: 'the estate''s own learning: observation, reviews and kaizen'
    repo: fiscus
  - id: exchequer
    serves: 'Nathan''s books: billing pulls, ledgers and the monthly close'
    repo: exchequer

policy:
  digest_budget_bytes: 14000
  explicit_only:
    grantspider: [src/grantspider/services, src/grantspider/connectors]
  coverage_floor:
    aigranthelper: null
    grantspider: null
    oversteward:
      orphans: 0
      overlaps: 0

