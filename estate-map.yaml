seams:
- id: S-1
  label: grantspider → aigranthelper (data)
  producer: [grantspider]
  consumer: [aigranthelper]
  flows: AG reads the research DB through **`ag_research.*` views and functions** (26 unmanaged `_v` models,
    plus search/match SQL functions), connecting with the read-only `ag_research_reader` role. Nine documented
    base-table reads remain, each tagged `READS-BASE-TABLE:`. `grantspider.ontology` supplies one type
    (`NteeCode`) and is not the read path
  cite: GS `src/grantspider/ag_research_views/__init__.py`; AG `apps/research/models/_views.py`, `apps/core/grantspider_reads.py`,
    `docs/CROSS_REPO_SCHEMA.md` rule 1; OverSteward `documentation/data-contract-grantspider-aigranthelper.md`
    v1.2
  invariants: [I-4, I-6]
- id: S-2
  label: grantspider → aigranthelper (code)
  producer: [grantspider]
  consumer: [aigranthelper]
  flows: 'AG pins GS by SHA (`requirements.txt:463`, matched by `research_schema.lock`) and imports `grantspider.models`,
    `connectors.b2_storage` and `services.db_backup` at runtime. A push to GS main fires `repository_dispatch:
    gs-master-bump`; AG''s bump workflow rejects non-`refs/heads/main` refs and force-updates one draft
    PR onto AG `staging`'
  cite: GS `.github/workflows/notify-ag-on-main.yml:25-49`; AG `.github/workflows/bump-gs-pin.yml:28,79,203,212`,
    `apps/research/apps.py:26`, `apps/ops/management/commands/backup_database.py:52,93`
  invariants: [I-18, I-19, I-20]
- id: S-3
  label: grantspider → aigranthelper (schema drift)
  producer: [grantspider]
  consumer: [aigranthelper]
  flows: AG CI diffs `_generated.py` against GS `schema/research.sql` at the locked SHA. `_views.py` is
    not checked (G1)
  cite: AG `scripts/tools/check_research_drift.py`, `.github/workflows/ci.yml:744`
  liabilities: [G1]
- id: S-4
  label: aigranthelper → grantspider
  producer: [aigranthelper]
  consumer: [grantspider]
  flows: 'Visitor data corrections: AG serves export + ack at `/internal/corrections/`; GS pulls them
    into pinned overrides'
  cite: AG `apps/feedback/urls_internal.py:23`; GS `connectors/ag_corrections.py`, `orchestration/ag_corrections_assets.py`
- id: S-5
  label: wphelper → aigranthelper, ai-assistants
  producer: [wphelper]
  consumer: [aigranthelper, ai-assistants]
  flows: 'Connector library: AG pins it by SHA (`requirements.txt:472`) for IndexNow + GSC; ai-assistants
    depends on it but still duplicates WP REST/FTP (L-AA-1)'
  cite: AG `apps/seo/management/commands/submit_seo_urls.py:7`; ai-assistants `pyproject.toml:63`, `src/almoner/wp/api.py`
  invariants: [I-9]
  liabilities: [L-AA-1]
- id: S-6
  label: oversteward → all repos
  producer: [oversteward]
  consumer: [aigranthelper, grantspider, wphelper, ai-assistants, gaudi, fiscus, exchequer]
  flows: '`registry.yaml`; `shared/` deployed to both `~/.claude` homes; the dev family by sow PRs. In
    OverSteward the deployed side is symlinks, elsewhere copies'
  cite: '`registry.yaml`, `src/oversteward/sow/`, `tests/test_deployed_links.py`'
  invariants: [I-21]
  liabilities: [L-DEV-1]
- id: S-7
  label: aigranthelper → fiscus
  producer: [aigranthelper]
  consumer: [fiscus]
  flows: Paginated NDJSON telemetry at `GET /internal/telemetry/`, RS256 JWT
  cite: 'AG `apps/telemetry/urls_internal.py:11`, `apps/telemetry/auth.py`; Fiscus `subjects/ghp-*/contract.yaml`
    (`status: stub`)'
  liabilities: [L-FI-1]
- id: S-8
  label: oversteward → fiscus
  producer: [oversteward]
  consumer: [fiscus]
  flows: '`data/pipeline_history.jsonl` read from disk (dispatch subject)'
  cite: Fiscus `subjects/dispatch/contract.yaml`
- id: S-9
  label: pickup repos → fiscus
  producer: [aigranthelper, grantspider, wphelper, ai-assistants, oversteward, exchequer]
  consumer: [fiscus]
  flows: '`andon`-labelled issues → `shared/andon.jsonl`. **The aggregator is a stub that only echoes**
    (L-FI-1)'
  cite: Fiscus `src/fiscus/andon.py:20-27`, `.github/workflows/weekly-review.yml`
  liabilities: [L-FI-1]
- id: S-10
  label: fiscus → oversteward
  producer: [fiscus]
  consumer: [oversteward]
  flows: '`fiscus review trajectories` JSON feeds the dream/kaizen worklist'
  cite: '`scripts/dream.py:215`'
- id: S-11
  label: grantspider → oversteward
  producer: [grantspider]
  consumer: [oversteward]
  flows: '`grantspider dq health --json` (stage health, locally or via `railway ssh`); Vintner reads `vintner.corpus_funnel_v`'
  cite: '`src/oversteward/stage_health/sources.py:113,171`; `src/oversteward/vintner/reader.py`'
- id: S-12
  label: aigranthelper → oversteward
  producer: [aigranthelper]
  consumer: [oversteward]
  flows: '`/internal/ops/reports/` read and `/internal/ops/verdicts/` write, bearer tokens'
  cite: '`src/oversteward/ag_ops/client.py:71-73`; AG `apps/ops/urls_internal.py`'
- id: S-13
  label: Railway, Sentry → oversteward
  producer: ['ext:Railway', 'ext:Sentry']
  consumer: [oversteward]
  flows: Liveness for contexts with a `railway:` block (AG, GS only); Sentry issues org-wide
  cite: '`src/oversteward/liveness/config.py:34`, `registry.yaml:166,298`; `src/oversteward/sentry/`'
- id: S-14
  label: billing APIs, GA4 → exchequer
  producer:
  - ext:billing APIs
  - ext:GA4
  consumer: [exchequer]
  flows: '`exchequer pull` → `ledgers/pulled_costs.csv` (Anthropic, Stripe, Neon consumption API, Railway);
    GA4 funnel events emitted by AG (`sign_up`, `funder_saved`, `purchase`, `lead_captured`)'
  cite: exchequer `src/exchequer/services/pull.py:59`, `src/exchequer/connectors/neon.py`; AG `apps/core/analytics.py:123-194`
  liabilities: [L-EX-1]

# IDs are stable and never renumbered; a retired invariant keeps its row with `status: retired`.
invariants:
- id: I-1
  status: live
  text: In-session pickup work never touches Nathan's live working tree (worktrees only)
  cite: '`shared/skills/dispatch/playbook.md:25-28` (grantspider #426 postmortem)'
  capabilities: [os.dispatch]
- id: I-2
  status: live
  text: 'One in-flight **agent** PR per repo: dispatch refuses while an `<kind>/issue-` PR is open. The
    two surfaces disagree on whether `docs/` counts (L-DOC-1). `session/<name>` PRs are not covered'
  cite: '`shared/skills/dispatch/playbook.md:36` (includes `docs`), `SKILL.md:79` (omits it)'
  capabilities: [os.dispatch]
- id: I-3
  status: live
  text: Never bypass git hooks (`--no-verify`, `--admin`, hooksPath); never `git add -A`
  cite: '`playbook.md:15,23`; `.claude/hooks/check_destructive_command.py`'
  capabilities: [os.dispatch]
- id: I-4
  status: live
  text: 'aigranthelper never writes the research DB: read-only Neon role, and the DB router''s `allow_migrate`
    returns `False` for every research label unconditionally'
  cite: AG `apps/core/db_router.py:34-46`, `config/settings/base.py:283`
  capabilities: [ag.research]
- id: I-5
