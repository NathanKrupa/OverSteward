  stack: Python ≥3.11
- id: ai-assistants
  purpose: '`almoner` package — content authoring, CRM, ingestion, WP integration. No CI'
  stack: Python
- id: oversteward
  purpose: 'Estate control plane: `registry.yaml`, canonical `shared/` (souls, agents, skills, hooks,
    dev scripts), session-start sweeps, dream cycle, review loop'
  stack: Python, uv, YAML; CI `.github/workflows/ci.yml` (not a required check)
- id: gaudi
  purpose: Architecture linter, open source (PyPI `gaudi-linter`); gates AG and OverSteward
