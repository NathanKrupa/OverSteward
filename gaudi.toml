# ABOUTME: gaudi-linter configuration for OverSteward.
# See https://pypi.org/project/gaudi-linter/ for the full schema.

[gaudi]
# Files we never want analysed:
#   .claude/worktrees/** — session worktrees are full checkouts nested inside
#                the repo, so without this exclude gaudi walks every open
#                session and reports the same finding once per worktree: a
#                clean tree shows 8 errors, a checkout with six sessions open
#                shows 47. The count tracked how many sessions were open
#                rather than anything about the code.
#   .venv/**   — installed dependencies, not our code.
#
# NOTE: aigranthelper excludes all of `.claude/**` because there the directory
# is purely local state. In OverSteward it is not — `.claude/hooks/` and
# `.claude/skills/` are tracked, canonical artifacts this repo owns and
# deploys to every other repo. They stay linted; only the nested worktrees
# are excluded.
exclude = [
    ".claude/worktrees/**",
    ".venv/**",
]
