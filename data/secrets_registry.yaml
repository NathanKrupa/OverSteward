# ABOUTME: Machine-readable copy list for documentation/secrets-registry.md — every place each secret is held. Names only, never values.
# ABOUTME: The OS#629 reconciliation sweep diffs this against Railway, laptop .env files and GitHub secrets; the markdown keeps the procedures.
#
# Coverage: database credentials only, measured 2026-10-22/23 (AG#2512, TD94)
# across both Railway projects' production and AG's staging, the laptop .env
# files of AG, GS, grantspider-crawl, OverSteward and ai-assistants, and GitHub
# secrets of AG, GS and OverSteward. Not measured by hand: other repos' GitHub
# secrets, and any non-database secret. The sweep's first run reports those as
# UNREGISTERED, and they are added from that measurement, not from memory.
#
# `name` is the secret's name as the markdown registry backticks it, so the two
# documents can be checked against each other. `owner` is a registry.yaml
# context id. Copy forms (exactly one location key per copy):
#   {railway: "<context id>/<environment>/<service>", var: NAME}
#   {dotenv: "/abs/path/.env", var: NAME}
#   {gh: "Owner/repo", var: NAME}
# One secret can be held under several variable names (a bare password and a
# full URL, a pooled and a _DIRECT line); each is a copy of the same entry.

version: 1

non_secret_prefixes:
  - RAILWAY_

non_secret: {}

secrets:
  # AG tenant Postgres, role postgres (Railway Postgres service). Production
  # services hold the ${{Postgres.DATABASE_URL}} reference; staging and GitHub
  # hold literals.
  - name: DATABASE_URL
    owner: aigranthelper
    copies:
      - {railway: "aigranthelper/production/Postgres", var: PGPASSWORD}
      - {railway: "aigranthelper/production/Postgres", var: POSTGRES_PASSWORD}
      - {railway: "aigranthelper/production/Postgres", var: DATABASE_URL}
      - {railway: "aigranthelper/production/Postgres", var: DATABASE_PUBLIC_URL}
      - {railway: "aigranthelper/production/aigranthelper", var: DATABASE_URL}
      - {railway: "aigranthelper/production/weekly_digest", var: DATABASE_URL}
      - {railway: "aigranthelper/production/render_sitemaps", var: DATABASE_URL}
      - {railway: "aigranthelper/production/daily_lifecycle", var: DATABASE_URL}
      - {railway: "aigranthelper/production/tenant_db_backup", var: DATABASE_URL}
      - {railway: "aigranthelper/production/submit_seo_urls", var: DATABASE_URL}
      - {railway: "aigranthelper/production/purge_deleted_accounts", var: DATABASE_URL}
      - {railway: "aigranthelper/production/warm-edge-cache", var: DATABASE_URL}
      - {railway: "aigranthelper/production/onboarding_emails", var: DATABASE_URL}
      - {railway: "aigranthelper/production/monitor_indexation", var: DATABASE_URL}
      - {railway: "aigranthelper/production/geo_visibility", var: DATABASE_URL}
      - {railway: "aigranthelper/production/deadline_reminders", var: DATABASE_URL}
      - {railway: "aigranthelper/staging/aigranthelper", var: DATABASE_URL}
      - {railway: "aigranthelper/staging/render-sitemaps", var: DATABASE_URL}
      - {gh: "NathanKrupa/aigranthelper", var: RAILWAY_PUBLIC_DATABASE_URL}

  # GS research DB, role ag_research_reader (Neon ep-plain-breeze).
  - name: RESEARCH_DATABASE_URL
    owner: aigranthelper
    copies:
      - {railway: "aigranthelper/production/aigranthelper", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/production/aigranthelper", var: RESEARCH_DATABASE_URL_POOLED}
      - {railway: "aigranthelper/production/daily_lifecycle", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/production/deadline_reminders", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/production/geo_visibility", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/production/monitor_indexation", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/production/onboarding_emails", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/production/purge_deleted_accounts", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/production/render_sitemaps", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/production/submit_seo_urls", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/production/weekly_digest", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/staging/aigranthelper", var: RESEARCH_DATABASE_URL}
      - {railway: "aigranthelper/staging/aigranthelper", var: RESEARCH_DATABASE_URL_POOLED}
      - {railway: "aigranthelper/staging/render-sitemaps", var: RESEARCH_DATABASE_URL}
      - {dotenv: "/home/natha/aigranthelper/.env", var: RESEARCH_DATABASE_URL}
      - {dotenv: "/home/natha/aigranthelper/.env", var: RESEARCH_DATABASE_URL_DIRECT}
      - {dotenv: "/home/natha/aigranthelper/.env", var: RESEARCH_DATABASE_URL_POOLED}

  # GS research DB, role gs_owner (Neon ep-plain-breeze).
  - name: GRANTSPIDER_NEON_DATABASE_URL
    owner: grantspider
    copies:
      - {railway: "grantspider/production/daemon-watchdog", var: GRANTSPIDER_NEON_DATABASE_URL}
      - {railway: "grantspider/production/dagster-code", var: GRANTSPIDER_NEON_DATABASE_URL}
      - {railway: "grantspider/production/dagster_daemon", var: GRANTSPIDER_NEON_DATABASE_URL}
      - {railway: "grantspider/production/embedding", var: GRANTSPIDER_NEON_DATABASE_URL}
      - {railway: "grantspider/production/embedding_gov", var: GRANTSPIDER_NEON_DATABASE_URL}
      - {railway: "grantspider/production/embedding_pages", var: GRANTSPIDER_NEON_DATABASE_URL}
      - {railway: "grantspider/production/grantspider", var: GRANTSPIDER_NEON_DATABASE_URL}
      - {dotenv: "/home/natha/grantspider/.env", var: GRANTSPIDER_NEON_DATABASE_URL}
      - {dotenv: "/home/natha/grantspider/.env", var: NEON_DATABASE_URL_DIRECT}
      - {dotenv: "/home/natha/grantspider-crawl/.env", var: GRANTSPIDER_NEON_DATABASE_URL}
      - {dotenv: "/home/natha/grantspider-crawl/.env", var: NEON_DATABASE_URL_DIRECT}

  # GS's own Railway Postgres, role postgres: the Dagster metadata DB that
  # production Dagster uses. The four Dagster services hold its password as a
  # literal DAGSTER_PG_PASSWORD (host DAGSTER_PG_HOST = this service).
  - name: DAGSTER_PG_PASSWORD
    owner: grantspider
    copies:
      - {railway: "grantspider/production/Postgres", var: PGPASSWORD}
      - {railway: "grantspider/production/Postgres", var: POSTGRES_PASSWORD}
      - {railway: "grantspider/production/Postgres", var: DATABASE_URL}
      - {railway: "grantspider/production/Postgres", var: DATABASE_PUBLIC_URL}
      - {railway: "grantspider/production/daemon-watchdog", var: DAGSTER_PG_PASSWORD}
      - {railway: "grantspider/production/dagster-code", var: DAGSTER_PG_PASSWORD}
      - {railway: "grantspider/production/dagster_daemon", var: DAGSTER_PG_PASSWORD}
      - {railway: "grantspider/production/grantspider", var: DAGSTER_PG_PASSWORD}

  # Neon ep-orange-sun, role grantspider_dagster_user. embedding and
  # embedding_gov still point their Dagster host here (bare password); the full
  # URL copies have no code consumer in GS. One role, two variable forms.
  - name: DAGSTER_PG_DB_URL
    owner: grantspider
    copies:
      - {railway: "grantspider/production/embedding", var: DAGSTER_PG_PASSWORD}
      - {railway: "grantspider/production/embedding_gov", var: DAGSTER_PG_PASSWORD}
      - {railway: "grantspider/production/dagster-code", var: DAGSTER_PG_DB_URL}
      - {railway: "grantspider/production/dagster_daemon", var: DAGSTER_PG_DB_URL}
      - {railway: "grantspider/production/embedding", var: DAGSTER_PG_DB_URL}
      - {railway: "grantspider/production/embedding_gov", var: DAGSTER_PG_DB_URL}
      - {railway: "grantspider/production/grantspider", var: DAGSTER_PG_DB_URL}
      - {dotenv: "/home/natha/grantspider/.env", var: DAGSTER_PG_DB_URL}
      - {dotenv: "/home/natha/grantspider-crawl/.env", var: DAGSTER_PG_DB_URL}
      # Laptop bare-password copies: stale (a different password from the
      # nine copies above) as measured 2026-10-23.
      - {dotenv: "/home/natha/grantspider/.env", var: DAGSTER_PG_PASSWORD}
      - {dotenv: "/home/natha/grantspider-crawl/.env", var: DAGSTER_PG_PASSWORD}

  # Dagster metadata DB, role neondb_owner (Neon ep-orange-sun). Laptop only.
  - name: DAGSTER_PG_DB_OWNER_URL
    owner: grantspider
    copies:
      - {dotenv: "/home/natha/grantspider/.env", var: DAGSTER_PG_DB_OWNER_URL}
      - {dotenv: "/home/natha/grantspider-crawl/.env", var: DAGSTER_PG_DB_OWNER_URL}

  # Frozen pre-cutover Neon AG tenant copy, role gs_backup_reader
  # (Neon ep-young-cherry), read by GS's weekly backup (AG#2512).
  - name: AG_TENANT_DATABASE_URL
    owner: grantspider
    copies:
      - {railway: "grantspider/production/dagster-code", var: AG_TENANT_DATABASE_URL}
      - {railway: "grantspider/production/dagster_daemon", var: AG_TENANT_DATABASE_URL}
      - {railway: "grantspider/production/embedding_gov", var: AG_TENANT_DATABASE_URL}
      - {railway: "grantspider/production/grantspider", var: AG_TENANT_DATABASE_URL}

  # GS CI test DB.
  - name: NEON_DATABASE_URL_CI
    owner: grantspider
    copies:
      - {gh: "NathanKrupa/grantspider", var: NEON_DATABASE_URL_CI}

  # GS research DB, role vintner_reader (Neon ep-plain-breeze).
  - name: VINTNER_RESEARCH_DATABASE_URL
    owner: oversteward
    copies:
      - {dotenv: "/home/natha/OverSteward/.env", var: VINTNER_RESEARCH_DATABASE_URL}

  # Frozen Neon AG tenant copy, role vintner_reader (Neon ep-young-cherry).
  # No code consumer.
  - name: VINTNER_AG_DATABASE_URL
    owner: oversteward
    copies:
      - {dotenv: "/home/natha/OverSteward/.env", var: VINTNER_AG_DATABASE_URL}

  # almoner DB, role neondb_owner (Neon ep-solitary-art).
  - name: NEON_DATABASE_URL
    owner: ai-assistants
    copies:
      - {dotenv: "/home/natha/ai-assistants/.env", var: NEON_DATABASE_URL}
      - {dotenv: "/home/natha/ai-assistants/.env", var: NEON_DATABASE_URL_DIRECT}
