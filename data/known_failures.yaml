# ABOUTME: Recorded failures the Estate Brief marks KNOWN→<repo>#n under URGENT instead of a fresh alarm.
# ABOUTME: Exact keys only — "<registry context id>/<service name>" as the liveness sweep names them.
#
# A line here silences nothing on its own: the brief marks the service KNOWN only
# while the named issue is open. When the issue closes, the alarm comes back and
# says the recorded issue is no longer open — then fix the service or remove the
# line. Lookup is an exact key match, never a title or a pattern. The brief stops
# (exit 2) on a key whose context is not a registry context with a GitHub remote,
# a service name that is not one whitespace-free token, or a value that is not
# "<registry id>#<number>". A key naming a service that does not exist is not
# caught here: it never matches, so that service still alarms.

railway:
  aigranthelper/monitor_indexation: aigranthelper#2481
