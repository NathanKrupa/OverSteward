repos:
  - repo: local
    hooks:
      - id: gaudi
        name: gaudi architectural linter
        entry: uv run gaudi check --exit-code --severity warn
        language: system
        pass_filenames: false
        always_run: true
      - id: secret-scan
        name: secret-scan gate (gitleaks, redacted)
        entry: uv run python scripts/dev/secret_scan.py --staged
        language: system
        pass_filenames: false
        always_run: true
