# ABOUTME: Commit-time gates for OverSteward — architectural errors + secret scan.
# ABOUTME: Installed via scripts/dev/install_hooks.sh; mirrors the aigranthelper/grantspider shape.

repos:
  - repo: local
    hooks:
      - id: gaudi-errors
        name: gaudi (architectural errors only — blocking)
        description: >
          Run gaudi at severity=error against changed Python files. Errors
          are a one-way ratchet — every entry is either a real defect or has
          a per-line `# noqa: <RULE-CODE>` with rationale. New errors are
          blocked at commit time, not at review.

          Severity is `error`, not `warn`: a clean tree carries 404 warnings,
          so a warn-level gate could never pass and was therefore never
          installed. Scope is the changed files rather than the whole tree,
          which also keeps `.claude/worktrees/` out of the result set — belt
          and braces with gaudi.toml's exclude.
        entry: python scripts/lint/gaudi_check_files.py
        language: system
        types: [python]
        pass_filenames: true
        exclude: ^\.claude/
      - id: trajectory-tags
        name: trajectory-note tags (category + promote — new notes only)
        description: >
          Assert every lesson bullet in a trajectory note's three capture
          sections carries a `[category]`, and every "What was learned" bullet
          a routable `→ promote:` target. Both drive downstream routing: an
          untagged bullet resolves to `uncategorized` and lands in the "Other"
          bucket, and an untagged `promote:` drops out of the promotion
          worklist entirely (OS#329, #325).

          Scope is whatever pre-commit passes — exactly the notes this commit
          adds or modifies. That is what makes the gate forward-looking: the
          legacy corpus is never handed in, so nothing has to retro-tag it.

          `files` matches the dated note filename only, so TEMPLATE.md and any
          other markdown under the directory are left alone.
        entry: python scripts/lint/trajectory_tags.py
        language: system
        files: ^documentation/trajectories/\d{4}-\d{2}-\d{2}-.*\.md$
        pass_filenames: true
      - id: secret-scan
        name: secret-scan gate (gitleaks, redacted)
        # Bare `python`, not `uv run python`. A worktree's .venv is a symlink
        # to the primary checkout's, and `uv run` re-syncs it — rebinding the
        # shared editable install to whichever worktree happened to commit, so
        # the primary checkout (where the resident operator runs) starts
        # importing a session branch's source. secret_scan.py is stdlib-only,
        # so it needs nothing uv provides.
        entry: python scripts/dev/secret_scan.py --staged
        language: system
        pass_filenames: false
        always_run: true
